[project]
name = "FastAPI-Template"
version = "0.1.0"
description = "Modern FastAPI backend with best practices"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.127.0",
    "granian[dotenv,pname,uvloop,reload]>=2.6.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "loguru>=0.7.3",
    "asyncpg>=0.31.0",
    "sqlmodel>=0.0.29",
    "fastapi-users[oauth,sqlalchemy]>=15.0.1",
    "fastcrud>=0.20.1",
]

[dependency-groups]
dev = [
    "ty>=0.0.7",
    "ruff>=0.14.10",
    "pytest-asyncio>=1.3.0",
    "pytest>=9.0.1",
    "alembic>=1.17.1",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.uv.index]]
url = "http://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv.workspace]
members = ["git"]

# Ruff
[tool.ruff]
exclude = ["alembic"]
line-length = 100
fix = true

[tool.ruff.lint]
future-annotations = true
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "I",    # isort
    "TID",  # tidy imports
    "PTH",  # pathlib
    "RUF",  # Ruff-specific
    "FAST", # fastapi-specific
]
ignore = [
    "E501",   # line too long
    "RUF029", # functions declared async that do not await 
    "F401",   # imported but unused
    # "F841",   # local variable assigned but never used
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true


# Pytest
[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "-s"]
pythonpath = "app"
log_cli = true
log_cli_level = "INFO"
markers = [
    "integration: marks tests that hit external services (deselect with '-m \"not integration\"')",
]
